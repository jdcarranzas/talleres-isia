# IncidentOps — topología de 2 contenedores (ADR-004): api (FastAPI + uv) + db (PostgreSQL 16)
# Uso:  docker compose up --build   ->   http://localhost:8000/health
# Credenciales de desarrollo local; en otros entornos sobrescriba con un archivo .env.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidentops}
      POSTGRES_USER: ${POSTGRES_USER:-incidentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-incidentops}:${POSTGRES_PASSWORD:-incidentops}@db:5432/${POSTGRES_DB:-incidentops}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
